[package]
name = "Rust_projects"
version = "0.1.0"
edition = "2024"

[dependencies]
bson = { version = "3", features = ["serde", "serde_json-1"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "rt"] }
serde = { version = "1.0.229", features = ["derive"] }
http = "1.5.0"
color-eyre = "0.6"
futures-util = "0.3"
thiserror = "2"
chrono = "0.4"

[dependencies.mongodb]
version = "3.9.1"

[profile.dev.package.backtrace]
opt-level = 3
